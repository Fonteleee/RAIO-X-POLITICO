<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente Fundo Apple Squircle -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Brilho Zenital de Borda -->
    <linearGradient id="sqBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gradiente do Frontão e Pilares -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Gradiente Feixe Ciano / Lente -->
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Corpo do Squircle Apple -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="url(#sqBg)" stroke="url(#sqBorder)" stroke-width="2"/>
  
  <!-- Reflexo Zenital Superior Translúcido (Curvatura Apple Glass) -->
  <path d="M 30 3 Q 64 6 98 3 A 26 26 0 0 1 125 30 Q 64 20 3 30 A 26 26 0 0 1 30 3 Z" fill="#ffffff" opacity="0.14"/>

  <!-- Brilho Cívico Central (Aura) -->
  <circle cx="64" cy="65" r="32" fill="#38bdf8" opacity="0.22" filter="url(#softGlow)"/>

  <!-- Símbolo: O Prisma Republicano dos 3 Poderes + Lente Cívica -->
  <!-- Base Cívica / Degraus da República -->
  <rect x="28" y="93" width="72" height="5" rx="2.5" fill="#94a3b8" opacity="0.8"/>
  <rect x="33" y="86" width="62" height="4.5" rx="2" fill="#cbd5e1" opacity="0.95"/>

  <!-- 3 Colunas dos Poderes (Executivo - Legislativo - Judiciário) -->
  <!-- Coluna 1 (Esquerda - Executivo) -->
  <path d="M 39 84 L 39 52 Q 39 49 42 49 L 45 49 Q 48 49 48 52 L 48 84 Z" fill="url(#pillarGrad)" opacity="0.92"/>
  <!-- Coluna 2 (Centro - Legislativo / Transparência) -->
  <path d="M 59.5 84 L 59.5 45 Q 59.5 42 64 42 Q 68.5 42 68.5 45 L 68.5 84 Z" fill="url(#pillarGrad)"/>
  <!-- Coluna 3 (Direita - Judiciário) -->
  <path d="M 80 84 L 80 52 Q 80 49 83 49 L 86 49 Q 89 49 89 52 L 89 84 Z" fill="url(#pillarGrad)" opacity="0.92"/>

  <!-- Frontão Superior / Cúpula Republicana Estilizada -->
  <path d="M 31 46 Q 64 32 97 46 L 97 41 Q 64 25 31 41 Z" fill="url(#pillarGrad)"/>
  <polygon points="64,28 72,36 56,36" fill="#ffffff"/>

  <!-- Lente do Raio-X & Foco Cívico (Diamante / Cristal Central) -->
  <g transform="translate(64, 63)">
    <!-- Anel de Foco Cívico -->
    <circle cx="0" cy="0" r="16.5" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="16.5" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>
    <circle cx="0" cy="0" r="12" fill="#0b1329" opacity="0.75"/>
    
    <!-- Prisma Diamante Central -->
    <path d="M 0 -8.5 L 8.5 0 L 0 8.5 L -8.5 0 Z" fill="url(#lensGlow)"/>
    
    <!-- Retículo de Foco de Alta Precisão -->
    <line x1="-15" y1="0" x2="-8.5" y2="0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8.5" y1="0" x2="15" y2="0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="0" y2="-8.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="8.5" x2="0" y2="15" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Ponto Focal Zenital -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
