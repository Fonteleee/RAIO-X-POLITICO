name: Figuras Políticas - Autopilot Social Diário (09:00 BRT)

on:
  schedule:
    # 09:00 BRT = 12:00 UTC (diariamente)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique a qualquer momento
  push:
    branches:
      - main
    paths:
      - 'scripts/social_autopilot.js'
      - 'scripts/x_browser_bot.js'
      - '.github/workflows/social_cron.yml'

jobs:
  run-autopilot:
    name: Figuras Políticas - Gerar & Distribuir Post Cívico
    runs-on: ubuntu-latest

    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        run: npm ci

      - name: Instalar Navegador Chromium (para Bot do X)
        if: env.X_AUTH_TOKEN != ''
        run: npx playwright install --with-deps chromium

      - name: Semear Banco de Dados Cívico (SQLite)
        run: node src/db/seed.js

      - name: Executar Motor Autônomo de Marketing
        env:
          # Segredos opcionais configurados em Settings > Secrets and variables > Actions
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/social_autopilot.js

      - name: Salvar Artefato do Post Diário
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-civic-post-${{ github.run_id }}
          path: output/social_queue/
          retention-days: 14
