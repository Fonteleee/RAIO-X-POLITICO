<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Político • Observatório Cívico 2026</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              canvas: '#f5f5f7',
              canvasDark: '#000000',
              cardLight: '#ffffff',
              cardDark: '#1c1c1e',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      background-image: 
        radial-gradient(at 15% 15%, rgba(14, 165, 233, 0.08) 0px, transparent 60%),
        radial-gradient(at 85% 20%, rgba(168, 85, 247, 0.07) 0px, transparent 55%);
    }
    html.dark body {
      background-color: #000000;
      color: #f5f5f7;
    }
    .swipe-card {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-black/10 dark:border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="index.html" class="font-bold text-xs sm:text-sm text-neutral-600 dark:text-neutral-300 hover:text-black dark:hover:text-white flex items-center gap-1.5 transition">
           <i data-lucide="arrow-left" class="w-4 h-4"></i> Início
        </a>
      </div>
      <h1 class="font-black text-sm sm:text-base text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500 flex items-center gap-1.5">
        <i data-lucide="sparkles" class="w-4 h-4 text-purple-500"></i> Tinder Cívico
      </h1>
      <div class="w-16"></div> <!-- Spacer for center alignment -->
    </div>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col items-center justify-center py-10">
    <!-- Quiz Interface -->
    <div id="quiz-container" class="w-full relative h-[450px]">
        <!-- Cards injected via JS -->
    </div>
    
    <!-- Results Interface -->
    <div id="results-container" class="w-full hidden space-y-6 animate-fade-in">
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500">Seus Maiores Matches</h2>
        <p class="text-sm text-neutral-500">Baseado no cruzamento oficial de propostas</p>
      </div>
      
      <div id="matches-list" class="space-y-4">
        <!-- Results injected via JS -->
      </div>
      
      <button onclick="location.reload()" class="w-full py-3.5 bg-black dark:bg-white text-white dark:text-black rounded-2xl font-bold shadow-lg hover:scale-[1.02] transition-transform flex items-center justify-center gap-2">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refazer Match
      </button>
    </div>
  </main>
  
  <script src="js/match.js"></script>
</body>
</html>
